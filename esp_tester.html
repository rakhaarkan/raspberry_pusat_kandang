<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP Network Tester</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root {
    --bg: #0d0f12;
    --panel: #141720;
    --border: #1f2433;
    --accent: #00e5ff;
    --accent2: #ff4d6d;
    --ok: #00e676;
    --warn: #ffd740;
    --muted: #4a5568;
    --text: #e2e8f0;
    --text2: #718096;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .logo {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    color: #000;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  header span {
    font-size: 12px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── IP List Editor ── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 10px;
  }

  #ipListContainer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }

  .ip-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .ip-row input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ip-row input:focus { border-color: var(--accent); }
  .ip-row input::placeholder { color: var(--muted); }

  .path-input {
    flex: 0.6 !important;
    color: var(--accent) !important;
  }

  .btn-remove {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent2);
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .btn-remove:hover { background: rgba(255,77,109,0.1); }

  .row-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .btn {
    padding: 9px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
  }

  .btn-add {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-add:hover { border-color: var(--accent); color: var(--accent); }

  .btn-scan {
    background: var(--accent);
    color: #000;
    flex: 1;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .btn-scan:hover { filter: brightness(1.1); }
  .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }

  /* ── Results ── */
  #results {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 10px;
  }

  .esp-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .esp-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .status-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ok      { background: var(--ok);    box-shadow: 0 0 6px var(--ok); }
  .dot-error   { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .dot-loading { background: var(--warn);  box-shadow: 0 0 6px var(--warn); animation: pulse 0.8s infinite; }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  .esp-ip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    flex: 1;
  }

  .esp-status-text {
    font-size: 11px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
  }

  .esp-latency {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ok);
  }

  .chevron {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .chevron.open { transform: rotate(90deg); }

  .esp-card-body {
    padding: 14px;
    display: none;
  }
  .esp-card-body.open { display: block; }

  /* JSON display */
  .json-container {
    background: #0a0c0f;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    max-height: 320px;
    overflow-y: auto;
  }

  pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .json-key    { color: #79c0ff; }
  .json-string { color: #a5d6ff; }
  .json-number { color: #f2cc60; }
  .json-bool   { color: #ff7b72; }
  .json-null   { color: var(--muted); }

  .error-msg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent2);
    padding: 8px;
  }

  /* Summary bar */
  #summaryBar {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .sum-item span:first-child { color: var(--text2); }
  .sum-ok     { color: var(--ok); }
  .sum-err    { color: var(--accent2); }
  .sum-total  { color: var(--accent); }

</style>
</head>
<body>

<header>
  <div class="logo">ESP</div>
  <div>
    <h1>Network Tester</h1>
    <span>Local JSON Monitor</span>
  </div>
</header>

<div class="section-title">Daftar IP ESP</div>
<div id="ipListContainer"></div>

<div class="row-buttons">
  <button class="btn btn-add" onclick="addIpRow()">+ Tambah IP</button>
  <button class="btn btn-scan" id="btnScan" onclick="startScan()">▶ Scan Semua</button>
</div>

<div id="summaryBar" style="display:none;">
  <div class="sum-item"><span>Total: </span><span class="sum-total" id="sumTotal">0</span></div>
  <div class="sum-item"><span>OK: </span><span class="sum-ok" id="sumOk">0</span></div>
  <div class="sum-item"><span>Error: </span><span class="sum-err" id="sumErr">0</span></div>
  <div class="sum-item"><span>Selesai: </span><span id="sumDone">0/0</span></div>
</div>

<div id="results"></div>

<script>
  // ── Default IP list ──────────────────────────────────────────────
  const defaultEsps = [
    { ip: "192.168.0.130", path: "/" },
    { ip: "192.168.0.150", path: ":8080/api/" },
    { ip: "192.168.0.150", path: ":8080/api/waktu" },
    { ip: "192.168.0.150", path: ":8080/api/kps" },
    { ip: "192.168.0.150", path: ":8080/api/shu" },
    { ip: "192.168.0.150", path: ":8080/api/mtd" },
    { ip: "192.168.0.151", path: "/" },
    { ip: "192.168.0.152", path: "/" },
    { ip: "192.168.0.153", path: "/" },
    { ip: "192.168.0.154", path: "/" },
    { ip: "192.168.0.155", path: "/" },
    { ip: "192.168.0.156", path: ":8080/api/" },
    { ip: "192.168.0.156", path: ":8080/api/waktu" },
    { ip: "192.168.0.156", path: ":8080/api/kps" },
    { ip: "192.168.0.156", path: ":8080/api/shu" },
    { ip: "192.168.0.156", path: ":8080/api/mtd" },
    { ip: "192.168.0.157", path: "/jdw" },
    { ip: "192.168.0.158", path: "/" },
    { ip: "192.168.0.159", path: "/jdw" },
    { ip: "192.168.0.160", path: "/all" }
    
  ];

  // ── Init ────────────────────────────────────────────────────────
  defaultEsps.forEach(e => addIpRow(e.ip, e.path));

  function addIpRow(ip = "", path = "/") {
    const container = document.getElementById('ipListContainer');
    const row = document.createElement('div');
    row.className = 'ip-row';
    row.innerHTML = `
      <input type="text" placeholder="192.168.0.xxx" value="${ip}" class="ip-input">
      <input type="text" placeholder="/json" value="${path}" class="path-input">
      <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(row);
  }

  // ── Scan ────────────────────────────────────────────────────────
  async function startScan() {
    const rows = document.querySelectorAll('.ip-row');
    const esps = [];

    rows.forEach(row => {
      const ip   = row.querySelector('.ip-input').value.trim();
      const path = row.querySelector('.path-input').value.trim() || '/json';
      if (ip) esps.push({ ip, path });
    });

    if (esps.length === 0) { alert("Tambahkan minimal 1 IP dulu."); return; }

    const btn = document.getElementById('btnScan');
    btn.disabled = true;
    btn.textContent = '⟳ Scanning...';

    const results = document.getElementById('results');
    const summary = document.getElementById('summaryBar');
    results.innerHTML = '';
    summary.style.display = 'flex';

    let ok = 0, err = 0, done = 0;
    const total = esps.length;

    document.getElementById('sumTotal').textContent = total;
    document.getElementById('sumOk').textContent    = 0;
    document.getElementById('sumErr').textContent   = 0;
    document.getElementById('sumDone').textContent  = `0/${total}`;

    // Buat cards dulu (loading state)
    esps.forEach(e => {
      const card = document.createElement('div');
      card.className = 'esp-card';
      card.id = `card-${(e.ip + e.path).replace(/[^a-zA-Z0-9]/g, '_')}`;
      card.innerHTML = `
        <div class="esp-card-header" onclick="toggleCard('${(e.ip + e.path).replace(/[^a-zA-Z0-9]/g, '_')}')">
          <div class="status-dot dot-loading"></div>
          <div class="esp-ip">${e.ip}${e.path}</div>
          <div class="esp-status-text" id="status-${(e.ip + e.path).replace(/[^a-zA-Z0-9]/g, '_')}">Menghubungi...</div>
          <div class="chevron" id="chev-${(e.ip + e.path).replace(/[^a-zA-Z0-9]/g, '_')}">›</div>
        </div>
        <div class="esp-card-body" id="body-${(e.ip + e.path).replace(/[^a-zA-Z0-9]/g, '_')}">
          <div class="json-container"><pre>Menunggu...</pre></div>
        </div>
      `;
      results.appendChild(card);
    });

    // Fetch semua paralel
    // Fetch semua paralel
    const promises = esps.map(async e => {
      const id  = (e.ip + e.path).replace(/[^a-zA-Z0-9]/g, '_');
      const dot = document.querySelector(`#card-${id} .status-dot`);
      const sta = document.getElementById(`status-${id}`);
      const body = document.getElementById(`body-${id}`);
      const t0  = Date.now();

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);

      try {
        const res = await fetch(`http://${e.ip}${e.path}`, { signal: controller.signal });
        clearTimeout(timeout);
        const ms = Date.now() - t0;

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const json = await res.json();
        dot.className  = 'status-dot dot-ok';
        sta.innerHTML  = `<span class="esp-latency">${ms}ms</span>`;
        body.innerHTML = `<div class="json-container"><pre>${syntaxHighlight(json)}</pre></div>`;
        ok++;

      } catch (ex) {
        clearTimeout(timeout);
        const ms = Date.now() - t0;
        dot.className   = 'status-dot dot-error';
        sta.textContent = `Error (${ms}ms)`;

        const msg = ex.name === 'AbortError' ? 'Timeout (>5s)' : ex.message;
        body.innerHTML  = `<div class="json-container"><div class="error-msg">✕ ${msg}</div></div>`;
        err++;
      }

      done++;
      document.getElementById('sumOk').textContent   = ok;
      document.getElementById('sumErr').textContent  = err;
      document.getElementById('sumDone').textContent = `${done}/${total}`;
    });

    await Promise.allSettled(promises);

    btn.disabled = false;
    btn.textContent = '▶ Scan Ulang';
  }

  // ── Toggle card ─────────────────────────────────────────────────
  function toggleCard(id) {
    document.getElementById(`body-${id}`).classList.toggle('open');
    document.getElementById(`chev-${id}`).classList.toggle('open');
  }

  // ── JSON syntax highlight ────────────────────────────────────────
  function syntaxHighlight(json) {
    const str = JSON.stringify(json, null, 2);
    return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*([eE][+-]?\d+)?)/g, match => {
      if (/^"/.test(match)) {
        if (/:$/.test(match)) return `<span class="json-key">${match}</span>`;
        return `<span class="json-string">${match}</span>`;
      }
      if (/true|false/.test(match)) return `<span class="json-bool">${match}</span>`;
      if (/null/.test(match))       return `<span class="json-null">${match}</span>`;
      return `<span class="json-number">${match}</span>`;
    });
  }

  // Run startScan on page load
  document.addEventListener('DOMContentLoaded', startScan);

</script>
</body>
</html>
